<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Real Estate Brokerage</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background Video -->
    <div class="video-container">
        <video autoplay muted loop playsinline id="bg-video">
            <source src="images/pr-video-1.mp4" type="video/mp4">
            Your browser does not support HTML5 video.
        </video>
    </div>

    <!-- Overlay Content -->
    <div class="overlay">

        <div class="top-bar">
            <!-- Small Image (Image 2) -->
            <div class="profile-container">
                <img src="images/pr-image-3.jpeg" alt="Profile" class="profile-icon">
            </div>

            <!-- Input Box -->
            <div class="input-container">
                <input type="text" value="http://liverealestatebrokerage.com/Pallmil" class="link-input" readonly>
            </div>
        </div>

        <!-- Left "LIVE" Graphic under the person -->
        <img src="images/pr-img-2.png" alt="Live Arrow Graphic" class="live-graphic blend-mode">

        <!-- Right part of the main Graphic (Globe, Gate) -->
        <img src="images/pr-img-1.jpeg" alt="Main Real Estate Graphic" class="main-graphic blend-mode">

        <!-- Right Side Route Graphics (Image 3) -->
        <img src="images/img-pr-4.png" alt="Route Graphic" class="route-graphic">

        <!-- Footer Text -->
        <!-- <
            <span class="text-red">Live Real Estate Brokarage / </span>
            <span class="text-gold">Our Brand Meant To Be The MarketPlace For The Public Real Estate And We Provide Dose Services in Highest Standerd in </span>
            <span class="text-red">Live Stream </span>
            <span class="text-gold">MarketPlace Sloutions For Our Global Users.</span>
        </div> -->

    </div>

</body>

</html>
